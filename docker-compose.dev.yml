name: invest_view

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: invest_view
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invest_view"]
      interval: 10s
      timeout: 5s
      retries: 5

  topic-init:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stock-ticks --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stock-alerts --partitions 3 --replication-factor 1"

  kis_ingestion:
    build:
      context: .
      dockerfile: services/kis_ingestion/Dockerfile
    env_file: .env
    environment:
      KIS_KAFKA_ENABLED: "true"
      KIS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KIS_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KIS_SUBSCRIPTION_CAP: "40"
      KIS_KAFKA_TOPIC: stock-ticks
      KIS_WATCH_SYMBOLS: '["005930","000660","005380","035420","035720","051910","006400","068270","105560","055550","000270","012330","005490","028260","066570","015760","032830","003550","017670","096770","034730","018260","009150","011200","086790","033780","010130","259960","316140","024110","138040","030200","090430","010950","011170","047050","002790","161390","078930","071050"]'
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  alert_service:
    build:
      context: .
      dockerfile: services/alert_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALERT_SERVICE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/invest_view
      ALERT_SERVICE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ALERT_SERVICE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ALERT_SERVICE_AVRO_SCHEMA_PATH: /app/schemas/stock-alerts.avsc
      ALERT_SERVICE_JWT_SECRET: dev-secret-change-me
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
