apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-pattern-persistence
  labels:
    app: event-pattern-persistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-pattern-persistence
  template:
    metadata:
      labels:
        app: event-pattern-persistence
    spec:
      initContainers:
        - name: alembic-migrate
          image: event_pattern_persistence:qa
          imagePullPolicy: Never
          command: ["/bin/sh", "-c", "cd /app/services/event_pattern_persistence && alembic upgrade head"]
          env:
            - name: EVENT_PATTERN_PERSISTENCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: event-pattern-persistence-secrets
                  key: EVENT_PATTERN_PERSISTENCE_DATABASE_URL
      containers:
        - name: event-pattern-persistence
          image: event_pattern_persistence:qa
          imagePullPolicy: Never
          command: ["python", "-m", "event_pattern_persistence"]
          envFrom:
            - configMapRef:
                name: event-pattern-persistence-config
            - secretRef:
                name: event-pattern-persistence-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
