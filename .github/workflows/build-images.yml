name: Build Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    name: Prepare shared image tag
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute sortable tag
        id: tag
        run: |
          TAG="main-$(git rev-parse --short HEAD)-$(date +%s)"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Using image tag: ${TAG}"

  build-service-images:
    name: Build and push ${{ matrix.image }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    needs: prepare-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kis_ingestion
            dockerfile: services/kis_ingestion/Dockerfile
            context: .
          - image: tick_persistence
            dockerfile: services/tick_persistence/Dockerfile
            context: .
          - image: alert_service
            dockerfile: services/alert_service/Dockerfile
            context: .
          - image: event_pattern_persistence
            dockerfile: services/event_pattern_persistence/Dockerfile
            context: .
          - image: invest_view_frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rover0811
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rover0811/${{ matrix.image }}:${{ needs.prepare-tag.outputs.tag }}

  build-flink-image:
    name: Build and push stream_detection
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    needs: prepare-tag
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/stream_detection_java/pom.xml

      - name: Build Flink fat JAR
        run: mvn -B -f services/stream_detection_java/pom.xml clean package -DskipTests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rover0811
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push stream_detection
        uses: docker/build-push-action@v6
        with:
          context: services/stream_detection_java
          file: services/stream_detection_java/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rover0811/stream_detection:${{ needs.prepare-tag.outputs.tag }}

  notify-build-result:
    name: Notify Slack build result
    if: always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    needs: [prepare-tag, build-service-images, build-flink-image]
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INVEST }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Build Images ${{ needs.build-service-images.result == 'success' && needs.build-flink-image.result == 'success' && 'success' || 'failure' }}\nTag: ${{ needs.prepare-tag.outputs.tag }}\nCommit: ${{ github.event.workflow_run.head_sha }}\nServices: kis_ingestion, tick_persistence, alert_service, event_pattern_persistence, frontend, stream_detection\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
