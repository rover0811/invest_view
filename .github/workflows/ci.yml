name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.8"
  RUFF_VERSION: "0.15.17"
  MYPY_VERSION: "2.1.0"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/tick_persistence/uv.lock
      - name: ruff check (service src)
        run: >-
          uvx ruff@${{ env.RUFF_VERSION }} check
          services/kis_ingestion/src
          services/tick_persistence/src

  type:
    name: Type (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/tick_persistence/uv.lock
      - name: "mypy --strict tick_persistence/src (event_ts/received_at datetime path)"
        run: >-
          uv run --with mypy==${{ env.MYPY_VERSION }}
          --project services/tick_persistence
          mypy --strict services/tick_persistence/src
      - name: "mypy --strict kis_ingestion event_id"
        run: >-
          uv run --with mypy==${{ env.MYPY_VERSION }}
          --project services/kis_ingestion
          mypy --strict services/kis_ingestion/src/kis_ingestion/event_id.py

  test:
    name: Test (pytest - ${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [kis_ingestion, tick_persistence]
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            services/tick_persistence/uv.lock
      - name: pytest ${{ matrix.service }}
        run: >-
          uv run --project services/${{ matrix.service }}
          pytest services/${{ matrix.service }}/tests -q
