[project]
name = "tick-persistence"
version = "0.1.0"
description = "Stock tick persistence service (Kafka consumer -> bronze/silver/serving)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.3",
    "fastavro",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "prometheus-client>=0.20",
]

[tool.uv]
dev-dependencies = [
    "hypothesis",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "qa: tests requiring real external dependencies (PostgreSQL/Kafka/SR via docker-compose)",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tick_persistence"]
