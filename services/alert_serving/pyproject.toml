[project]
name = "alert-serving"
version = "0.1.0"
description = "FastAPI alert-service: consumes stock-alerts/stock-patterns and pushes to user-facing WebSocket"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "confluent-kafka",
    "fastavro",
    "httpx",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_serving"]
