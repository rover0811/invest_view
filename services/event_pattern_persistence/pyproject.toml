[project]
name = "event-pattern-persistence"
version = "0.1.0"
description = "Stock pattern persistence service (Kafka consumer -> gold.pattern_events)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.3",
    "fastavro",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]>=4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "qa: tests requiring real external dependencies (PostgreSQL/Kafka/SR via docker-compose)",
]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_pattern_persistence"]
