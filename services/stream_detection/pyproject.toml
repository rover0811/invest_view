[project]
name = "stream-detection"
version = "0.1.0"
description = "Flink-based sliding window aggregation and CEP for stock-ticks → stock-alerts/stock-patterns"
requires-python = ">=3.11"
dependencies = [
    "apache-flink>=1.18.0",
    "confluent-kafka",
    "fastavro",
    "pydantic",
    "pydantic-settings",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_detection"]
