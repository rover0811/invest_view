# Final log4j config for stream-detection-java (T5.1).
# Copied into /opt/flink/conf/log4j-console.properties by the Dockerfile.
# Flink 1.18 uses log4j 2.x property syntax.

# Root: INFO, console only (FlinkDeployment captures stdout)
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c{1} - %m%n

# Suppress chatty Kafka client + ZooKeeper logs that obscure our own job events
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN

# Keep Flink runtime at INFO — useful for checkpoint events
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Our own code at INFO (StreamDetectionJob startup logs, rule firings)
logger.investview.name = com.invest_view
logger.investview.level = INFO
